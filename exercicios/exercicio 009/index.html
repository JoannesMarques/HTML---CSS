<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listas</title>
</head>
<body>
    <h1>trabalhando com listas</h1>
    <h2>listas ordenadas</h2>
    <ol type="i">
        <li>acorda
        <li>tomar café
        <li>ligar para o joão
        <li>assistir TV
        <li>ir para o trabalho
        <li>trabalhar
        <li>chegar em casa
        <li>assistir outro filme
    </ol>
    <h2>listas não ordenadas</h2>
    <ul type="square">
        <li>pão</li>
        <li>queijo</li>
        <li>presunto</li>
        <li>manteiga</li>
    </ul>
</body>
</html>

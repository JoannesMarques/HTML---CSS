<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alinhamento vertical</title>
    <style>
        #container {
            position: relative;
            height: 500px;
            padding: 10px;
            height: 96vh;
            background-image: url(target001.png);
            background-size: 100% 100%;
            background-color: purple;
            
        }

        #conteudo {
            position: absolute;
            height: 200px; background-color: yellow;
            width: 400px;
            margin: auto;

            background-image: url(target001.png);
            background-size: 100% 100%;
            left: 50%;
            top: 50%;
            transform: translate(-200px,-100px);
        }
        
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testando caixas</title>
    <style>
        h1 {
            background-color: rgb(209, 209, 209);
            height: 300px;
            width: 300px;
            
            padding: 20px 20px 50px 20px;

            border: 10px solid rgb(39, 39, 39);
            

            outline: 10px solid darkblue;
            
            margin: 50px auto;
            
        }
        a {
            display: block;
            background-color: rgb(209, 209, 209);
            border-width: 5px;
            border-style: solid;
            border-color: rgb(255, 0, 0);

            padding: 20px 20px 40px 20px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>paragrafos tambèm são exemplos de box-level, mas <a href="#">os links são exemplos de caixas inline</a> vamos ver com0o tudo isso funciona</p>
</body>
</html>
